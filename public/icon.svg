<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#0F2F57" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer measurement crosshair guides -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2563EB" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  <line x1="256" y1="20" x2="256" y2="70" stroke="#00D26A" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="442" x2="256" y2="492" stroke="#00D26A" stroke-width="8" stroke-linecap="round" />
  <line x1="20" y1="256" x2="70" y2="256" stroke="#00D26A" stroke-width="8" stroke-linecap="round" />
  <line x1="442" y1="256" x2="492" y2="256" stroke="#00D26A" stroke-width="8" stroke-linecap="round" />

  <!-- Piston body illustration -->
  <g transform="translate(106, 96)">
    <!-- Piston crown -->
    <path d="M 30,30 Q 150,15 270,30 L 270,90 L 30,90 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="6" stroke-linejoin="round" />
    <!-- Combustion bowl -->
    <ellipse cx="150" cy="36" rx="65" ry="14" fill="#475569" stroke="#1E293B" stroke-width="4" />

    <!-- Ring grooves -->
    <!-- Land 1 & Groove 1 -->
    <rect x="30" y="90" width="240" height="20" fill="url(#metalGrad)" stroke="#334155" stroke-width="5" />
    <rect x="42" y="110" width="216" height="12" fill="#1E293B" />
    <!-- Land 2 & Groove 2 -->
    <rect x="30" y="122" width="240" height="18" fill="url(#metalGrad)" stroke="#334155" stroke-width="5" />
    <rect x="42" y="140" width="216" height="12" fill="#1E293B" />
    <!-- Oil groove -->
    <rect x="30" y="152" width="240" height="18" fill="url(#metalGrad)" stroke="#334155" stroke-width="5" />
    <rect x="42" y="170" width="216" height="12" fill="#1E293B" />

    <!-- Piston skirt -->
    <path d="M 30,182 L 30,290 Q 75,310 110,280 L 110,240 Q 150,250 190,240 L 190,280 Q 225,310 270,290 L 270,182 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="6" stroke-linejoin="round" />

    <!-- Pin Boss Bore hole -->
    <circle cx="150" cy="225" r="38" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <circle cx="150" cy="225" r="28" fill="#0F172A" />
  </g>

  <!-- QC Target & Reticle Badge -->
  <g transform="translate(320, 310)">
    <circle cx="64" cy="64" r="64" fill="#00C853" stroke="#FFFFFF" stroke-width="8" />
    <path d="M 38 66 L 56 84 L 92 46" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
